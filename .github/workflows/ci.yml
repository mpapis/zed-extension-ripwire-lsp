name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - name: Normalize embedded source paths
        run: echo "RUSTFLAGS=--remap-path-prefix=$CARGO_HOME=/cargo --remap-path-prefix=$PWD=/src" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --release --target wasm32-wasip2 -- -D warnings
      - run: cargo build --release --target wasm32-wasip2
      - name: wasm artifact drift
        run: cmp target/wasm32-wasip2/release/zed_extension_ripwire_lsp.wasm extension.wasm
