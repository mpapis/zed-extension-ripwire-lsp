[package]
name = "zed-extension-ripwire-lsp"
version = "0.1.0"
edition = "2021"
description = "Zed extension registering the ripwire --lsp read-only whole-tree language server"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
zed_extension_api = "0.7"

[profile.release]
lto = true
opt-level = "z"